services:
  app:
    build:
      context: .
      args:
        WITH_DOCUMENT_SERVICES: ${WITH_DOCUMENT_SERVICES:-0}
        WITH_OBSERVABILITY: ${WITH_OBSERVABILITY:-0}
    ports: ["127.0.0.1:8091:8091"]
    environment:
      DEMO_MODE: "1"
      DATABASE_URL: postgresql+psycopg://pilot:local-demo-only@postgres:5432/procurepilot
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    volumes: ["attachment-data:/data"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: procurepilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: local-demo-only
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot -d procurepilot"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
  attachment-data:
