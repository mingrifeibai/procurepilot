apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-api" .Release.Name | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: procurepilot
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: 8091, targetPort: http}
